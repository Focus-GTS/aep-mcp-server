name: Release

# Publishing is triggered by pushing a version tag:
#
#   npm version minor          # bumps package.json, commits, tags
#   git push --follow-tags
#
# Everything after that is automated: gates, npm publish with provenance,
# and a GitHub Release whose notes come from CHANGELOG.md.
#
# Nothing here can publish from a branch push or a manual edit — only a
# `v*` tag reaches this workflow.
#
# ⚠️ DO NOT RENAME THIS FILE. npm Trusted Publishing binds to the workflow
# filename (`release.yml`). Renaming it silently breaks publishing — npm will
# reject the OIDC token because it no longer matches the registered publisher.
on:
  push:
    tags:
      - "v*"

# Least privilege. `contents: write` is needed to create the GitHub Release;
# `id-token: write` is what lets npm mint a provenance attestation proving the
# package was built by this workflow from this repo.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Verify, publish, release
    runs-on: ubuntu-latest

    # Binding to an environment means npm publishing can be gated behind a
    # required reviewer in repo settings if that is ever wanted, without
    # changing this file.
    environment: npm-publish

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      # ---------------------------------------------------------------- gates
      # Everything below must pass before anything is published. npm versions
      # are immutable — a bad publish cannot be taken back, only superseded.

      - name: Tag must match package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG."
            echo "::error::Bump the version and re-tag. Publishing the wrong version is not reversible."
            exit 1
          fi

      - name: Version must not already exist on npm
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VER="$(node -p "require('./package.json').version")"
          if npm view "$PKG_NAME@$PKG_VER" version >/dev/null 2>&1; then
            echo "::error::$PKG_NAME@$PKG_VER is already published. npm versions are immutable."
            echo "::error::Bump to a new version rather than re-running this release."
            exit 1
          fi
          echo "$PKG_NAME@$PKG_VER is unpublished — safe to proceed."

      - name: server.json version must match too
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SJ="$(node -p "require('./server.json').version")"
          SJP="$(node -p "require('./server.json').packages[0].version")"
          if [ "$TAG" != "$SJ" ] || [ "$TAG" != "$SJP" ]; then
            echo "::error::server.json is at $SJ (package $SJP) but the tag is $TAG."
            echo "::error::Run: npm run sync-version   then commit and re-tag."
            exit 1
          fi

      - name: server.json mcpName must match package.json
        run: |
          A="$(node -p "require('./server.json').name")"
          B="$(node -p "require('./package.json').mcpName")"
          if [ "$A" != "$B" ]; then
            echo "::error::server.json name ($A) != package.json mcpName ($B)."
            echo "::error::The MCP Registry verifies ownership by matching these; publishing will be rejected."
            exit 1
          fi

      - name: CHANGELOG must have an entry for this version
        run: node scripts/extract-changelog.mjs "${GITHUB_REF_NAME}" > /dev/null

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Catches the case where the built output is missing or the bin entry
      # does not resolve — a package that installs but cannot start.
      - name: Smoke-check the built entrypoint
        run: |
          BIN="$(node -p "require('./package.json').bin['aep-mcp']")"
          test -f "$BIN" || { echo "::error::bin target $BIN missing from build"; exit 1; }
          # Import the tool registry and assert the full surface registers.
          # Catches a build that emits files but cannot actually load.
          node --input-type=module -e "
            const { registerAllTools } = await import('./dist/tools/index.js');
            const names = [];
            registerAllTools(
              { registerTool: (n) => names.push(n), tool: (n) => names.push(n) },
              { client: {}, tokenCache: {}, credentials: {
                  clientId: 'x', clientSecret: 'y',
                  orgId: 'z@AdobeOrg', sandboxName: 'dev' } },
            );
            if (names.length === 0) {
              console.error('::error::build produced no registered tools');
              process.exit(1);
            }
            console.log(\`built entrypoint resolves — \${names.length} tools register\`);
          "

      # -------------------------------------------------------------- publish

      - name: Publish to npm (Trusted Publishing / OIDC)
        # No token. GitHub mints a short-lived OIDC token that npm verifies
        # against the trusted publisher registered on the package, so there is
        # no long-lived credential to leak or rotate.
        #
        # `--provenance` is deliberately absent: under trusted publishing npm
        # generates and publishes the attestation itself, and passing the flag
        # is redundant.
        run: npm publish --access public

      # -------------------------------------------------------- github release

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          {
            echo 'body<<CHANGELOG_EOF'
            node scripts/extract-changelog.mjs "${GITHUB_REF_NAME}"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "${{ steps.notes.outputs.body }}" \
            --verify-tag

      # ------------------------------------------------------------ registries
      # Most MCP registries discover from npm and GitHub rather than accepting
      # a push. This step nudges the ones that support it and is deliberately
      # non-fatal: a registry being slow or down must never fail a release that
      # has already published successfully.

      # The Official MCP Registry accepts a push and authenticates via the same
      # GitHub OIDC token, so no secret is needed. It verifies ownership by
      # reading `mcpName` back out of the tarball we just published to npm —
      # which is why this step runs AFTER the npm publish.
      #
      # continue-on-error: the package is already live on npm by this point.
      # A registry outage must not turn a successful release into a failed one.
      - name: Publish to the Official MCP Registry
        continue-on-error: true
        run: |
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      # Glama re-runs its analysis on every commit once the repo is claimed,
      # and mcp.so is a one-time submission — neither accepts a release ping.
      # See docs/PUBLISHING.md.
      - name: Registry status
        run: |
          echo "npm:           published"
          echo "MCP Registry:  attempted (see step above)"
          echo "Glama:         re-scans automatically on every commit — nothing to do"
          echo "mcp.so:        one-time manual submission — see docs/PUBLISHING.md"
