name: Release

# Publishing is triggered by pushing a version tag:
#
#   npm version minor          # bumps package.json, commits, tags
#   git push --follow-tags
#
# Everything after that is automated: gates, npm publish with provenance,
# and a GitHub Release whose notes come from CHANGELOG.md.
#
# Nothing here can publish from a branch push or a manual edit — only a
# `v*` tag reaches this workflow.
on:
  push:
    tags:
      - "v*"

# Least privilege. `contents: write` is needed to create the GitHub Release;
# `id-token: write` is what lets npm mint a provenance attestation proving the
# package was built by this workflow from this repo.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Verify, publish, release
    runs-on: ubuntu-latest

    # Binding to an environment means npm publishing can be gated behind a
    # required reviewer in repo settings if that is ever wanted, without
    # changing this file.
    environment: npm-publish

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      # ---------------------------------------------------------------- gates
      # Everything below must pass before anything is published. npm versions
      # are immutable — a bad publish cannot be taken back, only superseded.

      - name: Tag must match package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG."
            echo "::error::Bump the version and re-tag. Publishing the wrong version is not reversible."
            exit 1
          fi

      - name: Version must not already exist on npm
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VER="$(node -p "require('./package.json').version")"
          if npm view "$PKG_NAME@$PKG_VER" version >/dev/null 2>&1; then
            echo "::error::$PKG_NAME@$PKG_VER is already published. npm versions are immutable."
            echo "::error::Bump to a new version rather than re-running this release."
            exit 1
          fi
          echo "$PKG_NAME@$PKG_VER is unpublished — safe to proceed."

      - name: CHANGELOG must have an entry for this version
        run: node scripts/extract-changelog.mjs "${GITHUB_REF_NAME}" > /dev/null

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Catches the case where the built output is missing or the bin entry
      # does not resolve — a package that installs but cannot start.
      - name: Smoke-check the built entrypoint
        run: |
          BIN="$(node -p "require('./package.json').bin['aep-mcp']")"
          test -f "$BIN" || { echo "::error::bin target $BIN missing from build"; exit 1; }
          # Import the tool registry and assert the full surface registers.
          # Catches a build that emits files but cannot actually load.
          node --input-type=module -e "
            const { registerAllTools } = await import('./dist/tools/index.js');
            const names = [];
            registerAllTools(
              { registerTool: (n) => names.push(n), tool: (n) => names.push(n) },
              { client: {}, tokenCache: {}, credentials: {
                  clientId: 'x', clientSecret: 'y',
                  orgId: 'z@AdobeOrg', sandboxName: 'dev' } },
            );
            if (names.length === 0) {
              console.error('::error::build produced no registered tools');
              process.exit(1);
            }
            console.log(\`built entrypoint resolves — \${names.length} tools register\`);
          "

      # -------------------------------------------------------------- publish

      - name: Publish to npm
        # --provenance publishes a signed attestation linking this exact
        # tarball to this repo, commit, and workflow. It shows on the npm page
        # and is verifiable by consumers.
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # -------------------------------------------------------- github release

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          {
            echo 'body<<CHANGELOG_EOF'
            node scripts/extract-changelog.mjs "${GITHUB_REF_NAME}"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "${{ steps.notes.outputs.body }}" \
            --verify-tag

      # ------------------------------------------------------------ registries
      # Most MCP registries discover from npm and GitHub rather than accepting
      # a push. This step nudges the ones that support it and is deliberately
      # non-fatal: a registry being slow or down must never fail a release that
      # has already published successfully.

      - name: Ping registries
        continue-on-error: true
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VER="$(node -p "require('./package.json').version")"
          echo "Published $PKG_NAME@$PKG_VER"
          echo "Registries that crawl npm/GitHub will pick this up on their next scan."
          echo "See docs/PUBLISHING.md for which registries need a manual nudge."
