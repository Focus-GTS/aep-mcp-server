name: Feature request
description: Suggest a capability that isn't a new AEP tool
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For requesting a **new AEP tool**, use the "New tool request" template instead —
        it asks the endpoint-specific questions we need.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: |
        Describe the workflow that's blocked or awkward today, not just the
        feature you have in mind. The underlying problem often has a better solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Including any workaround you're using now.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authentication / credentials
        - Error handling
        - Logging / observability
        - Pagination
        - Packaging / distribution
        - Documentation
        - Other
    validations:
      required: false
