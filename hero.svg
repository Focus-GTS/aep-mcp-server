<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="AEP MCP Server">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="0.55" stop-color="#0e1830"/>
      <stop offset="1" stop-color="#0a1226"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fa0f00"/>
      <stop offset="1" stop-color="#a80b00"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" rx="14" fill="url(#bg)"/>
  <rect x="0" y="0" width="9" height="360" rx="4" fill="url(#accent)"/>

  <!-- agent -> server -> APIs motif (right side) -->
  <g opacity="0.9" font-family="Helvetica, Arial, sans-serif">
    <g stroke="#2a3a5e" stroke-width="1.6" fill="none" opacity="0.7">
      <line x1="892" y1="180" x2="1010" y2="120"/>
      <line x1="892" y1="180" x2="1010" y2="180"/>
      <line x1="892" y1="180" x2="1010" y2="240"/>
      <line x1="892" y1="180" x2="1010" y2="300"/>
    </g>
    <rect x="792" y="156" width="100" height="48" rx="9" fill="#101c36" stroke="#3d5891" stroke-width="1.5"/>
    <text x="842" y="185" text-anchor="middle" font-size="14" fill="#cdd9f0" font-weight="600">AI agent</text>
    <g fill="#101c36" stroke="#273a63" stroke-width="1.5">
      <rect x="1010" y="98" width="150" height="44" rx="9"/>
      <rect x="1010" y="158" width="150" height="44" rx="9"/>
      <rect x="1010" y="218" width="150" height="44" rx="9"/>
      <rect x="1010" y="278" width="150" height="44" rx="9"/>
    </g>
    <g font-size="13" fill="#9fb1d6">
      <text x="1085" y="125" text-anchor="middle">Schema Registry</text>
      <text x="1085" y="185" text-anchor="middle">Ingestion</text>
      <text x="1085" y="245" text-anchor="middle">Profiles / RTCDP</text>
      <text x="1085" y="305" text-anchor="middle">Data Lifecycle</text>
    </g>
    <circle cx="892" cy="180" r="4" fill="#ff6a60"/>
    <!-- animated data pulses agent -> APIs -->
    <circle r="4.5" fill="#7fd1ff">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M892,180 L1010,120"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" fill="#7fd1ff">
      <animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite" path="M892,180 L1010,180"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" fill="#7fd1ff">
      <animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M892,180 L1010,240"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" fill="#7fd1ff">
      <animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite" path="M892,180 L1010,300"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- wordmark -->
  <text x="64" y="120" font-family="Helvetica, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="1" fill="#ffffff">AEP MCP Server</text>
  <text x="66" y="166" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#cdd9f0">The write path for Adobe Experience Platform</text>
  <text x="66" y="200" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#7f90b4">Ingest &#183; compose &#183; activate &#183; erase &#8212; from any AI agent</text>

  <!-- stat chips -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="64" y="248" width="150" height="60" rx="10" fill="#101c36" stroke="#273a63" stroke-width="1.5"/>
    <text x="139" y="278" text-anchor="middle" font-size="26" fill="#ffffff" font-weight="700">51</text>
    <text x="139" y="298" text-anchor="middle" font-size="12" fill="#7f90b4">tools</text>

    <rect x="226" y="248" width="210" height="60" rx="10" fill="#101c36" stroke="#273a63" stroke-width="1.5"/>
    <text x="331" y="276" text-anchor="middle" font-size="19" fill="#ffffff" font-weight="700">Read + write</text>
    <text x="331" y="297" text-anchor="middle" font-size="14" fill="#cdd9f0">Adobe&#8217;s is read-only</text>

    <rect x="448" y="248" width="250" height="60" rx="10" fill="#161208" stroke="#5a4a14" stroke-width="1.5"/>
    <text x="573" y="276" text-anchor="middle" font-size="15" fill="#f2c94c" font-weight="700">safe by default</text>
    <text x="573" y="297" text-anchor="middle" font-size="12" fill="#9a8a4a">fail-closed write guard</text>
  </g>
</svg>
